<style>
:root {
  --bg: #e8ece2;
  --paper: #f4f6ef;
  --ink: #1f3a2e;
  --muted: #5d6d61;
  --line: #c7d0c0;
  --brass: #a07a1c;
  --flag: #b8321c;
  --inst: #cfc8b4;
  --shadow: rgba(31, 58, 46, 0.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f201a;
    --paper: #162b23;
    --ink: #eee7d3;
    --muted: #9fae9f;
    --line: #2c4438;
    --brass: #d6b45c;
    --flag: #ef7a5c;
    --inst: #4a5348;
    --shadow: rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body {
  font-family: "Baskerville", "Baskerville Old Face", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: 16px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden;
}
header {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--paper);
}
header h1 { margin: 0; font-size: 1.45rem; font-weight: 400; font-style: italic; }
header .sub { color: var(--muted); font-size: 0.85rem; }
.tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
input[type=search] {
  font: inherit; font-size: 0.95rem; padding: 5px 10px; width: 220px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 3px;
}
button, select {
  font: inherit; font-size: 0.92rem; color: var(--ink); background: transparent;
  border: 1px solid var(--line); padding: 4px 11px; border-radius: 3px; cursor: pointer;
}
select { background: var(--bg); padding: 4px 8px; }
button:hover { border-color: var(--ink); }
button[aria-pressed=true], button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }

main { position: relative; flex: 1; min-height: 0; display: flex; }

canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }

#status {
  position: absolute; top: 10px; left: 12px; max-width: 60%; font-size: 0.85rem;
  background: var(--paper); border: 1px solid var(--line); border-left: 3px solid var(--brass);
  padding: 4px 10px; display: none;
}

#timebar {
  position: absolute; left: 12px; right: 12px; bottom: 10px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 4px;
  box-shadow: 0 2px 12px var(--shadow); padding: 8px 14px 8px; display: grid; gap: 6px;
}
.trow { display: flex; align-items: center; gap: 12px; min-width: 0; }
#year { flex: 1; min-width: 80px; accent-color: var(--brass); }

  font-size: 2.4rem; font-style: italic; line-height: 1; min-width: 4.4ch; text-align: right;
  font-variant-numeric: oldstyle-nums; color: var(--ink);
}

aside { background: var(--paper); overflow-y: auto; }
#filters { width: 290px; border-right: 1px solid var(--line); padding: 12px 16px 24px; display: none; }

.chips { display: flex; flex-wrap: wrap; gap: 5px; }

button[aria-pressed=true] .n { color: inherit; opacity: 0.7; }
.toggles label { display: flex; gap: 8px; align-items: center; font-size: 0.9rem; margin: 3px 0; cursor: pointer; }
.key { font-size: 0.85rem; color: var(--muted); }

.linkbtn { border: none; padding: 0; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--line); background: none; text-align: left; }

#panel .close { float: right; margin-left: 8px; }

#panel .full { color: var(--muted); font-style: italic; font-size: 0.92rem; }
#panel dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 14px 0; font-size: 0.92rem; }

.back { font-size: 0.85rem; margin-bottom: 8px; display: inline-block; }
.badge { display: inline-block; font-size: 0.78rem; padding: 0 7px; border-radius: 999px; color: #fff; margin: 0 3px 3px 0; }
.conf { font-size: 0.75rem; border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; color: var(--muted); white-space: nowrap; }
.conf.medium { border-color: var(--brass); color: var(--brass); }
.conf.low { border-color: var(--flag); color: var(--flag); }

.flag { border-left: 3px solid var(--flag); padding: 6px 10px; margin: 10px 0; background: var(--bg); font-size: 0.9rem; }
.flag.note { border-left-color: var(--muted); }
.flag b { font-weight: 600; display: block; font-size: 0.85rem; }
.bridge, .banner { border-left: 3px solid var(--brass); padding: 6px 10px; margin: 10px 0; background: var(--bg); font-size: 0.9rem; }
.src { color: var(--muted); font-size: 0.82rem; }
.src .linkbtn { color: var(--muted); font-size: 0.82rem; }
.rels { list-style: none; padding: 0; margin: 4px 0 10px; }
.rels li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
.rels li:last-child { border-bottom: none; }
.reltype { display: flex; align-items: center; gap: 8px; }
.note-text { font-size: 0.82rem; font-style: italic; color: var(--muted); }
.cov { margin: 0 0 12px; font-size: 0.9rem; }
.cov b { font-weight: 600; }
.issues { color: var(--flag); font-size: 0.85rem; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }

.form label { display: block; margin: 10px 0 0; font-size: 0.88rem; color: var(--muted); }
.form input:not([type=checkbox]):not([type=search]), .form select, .form textarea {

  background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 5px 8px; margin-top: 3px;
}
.form input[type=search] { width: 100%; margin-top: 4px; }
.form fieldset { border: 1px solid var(--line); border-radius: 3px; margin: 12px 0 0; padding: 6px 10px 10px; }
.form legend { font-size: 0.88rem; color: var(--muted); padding: 0 4px; }
.form .inline label { display: inline-flex; gap: 5px; align-items: center; margin: 3px 12px 0 0; color: var(--ink); font-size: 0.9rem; }
.checklist { max-height: 190px; overflow-y: auto; margin-top: 6px; }
.form .checklist label { display: flex; gap: 8px; align-items: baseline; margin: 2px 0; color: var(--ink); font-size: 0.88rem; }
.wkey { color: var(--muted); font-size: 0.75rem; margin-left: auto; padding-left: 8px; }

.flagrow:first-child { border-top: none; margin-top: 0; }
#exportBox { width: 100%; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.75rem; background: var(--bg); color: var(--ink); border: 1px solid var(--line); }

@media (max-width: 820px) {
  header h1 { font-size: 1.2rem; }
  header .sub { display: none; }
  input[type=search] { width: 140px; }
  #stats { display: none; }
  #filters, #panel {
    position: absolute; left: 0; right: 0; bottom: 0; width: auto; max-height: 62%;
    border: none; border-top: 1px solid var(--line); box-shadow: 0 -6px 24px var(--shadow); z-index: 5;
  }
  #timebar { left: 6px; right: 6px; bottom: 6px; padding: 6px 10px; }
  .yearbig { font-size: 1.8rem; }
  #bookSel { max-width: 100%; flex: 1; }
  #yearNote { display: none; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>The Wodehouse Map</h1>
    <div class="sub">Who is engaged to, employed by, or hiding from whom</div>
  </div>
  <div class="tools">
    <input type="search" id="search" list="names" placeholder="Find a character" aria-label="Find a character">
    <datalist id="names"></datalist>
    <button id="btnFilters" aria-pressed="false">Filters</button>
    <button id="btnEdit">Edit data</button>
    <button id="btnNotes">Coverage</button>
  </div>
</header>
<main>
  <aside id="filters" aria-label="Filters"></aside>
  <div id="stage">
    <canvas id="cv" aria-label="Character relationship graph"></canvas>
    <div id="status" role="status"></div>
    <div id="topright"><span id="stats"></span><button id="btnFit">Fit</button></div>
    <div id="timebar">
      <div class="trow">
        <button id="play" aria-label="Play the canon year by year">Play</button>
        <input type="range" id="year" aria-label="Show the canon up to this year">
        <div class="yearbig" id="yearLabel"></div>
      </div>
      <div class="trow">
        <select id="bookSel" aria-label="View one book's world"></select>
        <span id="yearNote"></span>
      </div>
    </div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>

<script>
(function () {
  "use strict";
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const clone = o => JSON.parse(JSON.stringify(o));

  /* ================= Base data + shared edits ================= */
  const BASE = clone(DATA);
  (() => {
    const seen = {};
    BASE.relationships.forEach(r => {
      let id = r.id || `${r.s}|${r.type}|${r.t}`;
      if (seen[id]) { seen[id]++; id = id + "#" + seen[id]; } else seen[id] = 1;
      r.id = id;
    });
  })();
  const baseCharIds = new Set(BASE.characters.map(c => c.id));
  const baseRelIds = new Set(BASE.relationships.map(r => r.id));
  const STORE_KEY = "wodehouse-map:edits:v1";
  const WHO_KEY = "wodehouse-map:who";
  const READ_ONLY = typeof CONFIG === "object" && !!CONFIG.readOnly;
  const storageOK = !READ_ONLY && typeof window.storage === "object" && window.storage !== null && typeof window.storage.get === "function";
  const emptyEdits = () => ({ v: 1, characters: {}, relationships: {}, works: {}, log: [] });
  function normalise(o) {
    const e = emptyEdits();
    if (o && typeof o === "object") {
      ["characters", "relationships", "works"].forEach(k => { if (o[k] && typeof o[k] === "object") e[k] = o[k]; });
      if (Array.isArray(o.log)) e.log = o.log;
    }
    return e;
  }
  let EDITS = emptyEdits();
  let who = "";
  let D = null;

  function mergeData() {
    const works = Object.assign({}, BASE.works);
    Object.keys(EDITS.works).forEach(k => { const w = EDITS.works[k]; if (w && !w.deleted && w.t) works[k] = w; });
    const characters = [];
    BASE.characters.forEach(c => { const o = EDITS.characters[c.id]; if (o && o.deleted) return; characters.push(o || c); });
    Object.keys(EDITS.characters).forEach(id => { const o = EDITS.characters[id]; if (!baseCharIds.has(id) && o && !o.deleted) characters.push(o); });
    const relationships = [];
    BASE.relationships.forEach(r => { const o = EDITS.relationships[r.id]; if (o && o.deleted) return; relationships.push(o || r); });
    Object.keys(EDITS.relationships).forEach(id => { const o = EDITS.relationships[id]; if (!baseRelIds.has(id) && o && !o.deleted) relationships.push(o); });
    return { clusters: BASE.clusters, edgeTypes: BASE.edgeTypes, works, characters, relationships, coverage: BASE.coverage };
  }

  /* ================= Graph ================= */
  let nodes = [], links = [], byId = new Map(), issues = [];
  const order = ["jw", "mu", "om", "uk", "sc", "ps", "bl", "sa", "uf", "dr"];
  const centers = { inst: { x: 0, y: 0 } };
  order.forEach((k, i) => {
    const a = (i / order.length) * Math.PI * 2 - Math.PI / 2;
    centers[k] = { x: Math.cos(a) * 520, y: Math.sin(a) * 520 };
  });
  Object.keys(BASE.clusters).forEach(k => { if (!centers[k]) centers[k] = { x: 0, y: 0 }; });
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // view state
  const enabledSeries = new Set(Object.keys(BASE.clusters));
  const enabledTypes = new Set(Object.keys(BASE.edgeTypes));
  const roleFilter = new Set();
  let onlyBridges = false, onlyFlagged = false, showUncertain = true;
  let selected = null, hover = null;
  let alpha = 1, alphaTarget = 0, dirty = true;
  let yearMax = Infinity, yMin = 1900, yMaxBound = 1975, eventYears = [];
  let book = null, bookMembers = new Set(), posSnapshot = null;
  const T = { x: 0, y: 0, k: 0.6 };

  function buildGraph() {
    D = mergeData();
    const pos = new Map(nodes.map(n => [n.id, { x: n.x, y: n.y }]));
    nodes = []; links = []; byId = new Map(); issues = [];
    D.characters.forEach(c => {
      if (!c || !c.id) return;
      if (byId.has(c.id)) { issues.push("Duplicate character id: " + c.id); return; }
      if (!D.works[c.first]) issues.push(`${c.id}: unknown first-appearance work "${c.first}"`);
      (c.series || []).forEach(s => { if (!D.clusters[s]) issues.push(`${c.id}: unknown series "${s}"`); });
      (c.appears || []).forEach(w => { if (!D.works[w]) issues.push(`${c.id}: appears cites unknown work "${w}"`); });
      (c.flags || []).forEach(f => (f.works || []).forEach(w => { if (!D.works[w]) issues.push(`${c.id}: flag cites unknown work "${w}"`); }));
      const series = (c.series || []).filter(s => D.clusters[s]);
      if (!series.length) series.push("sa");
      const n = Object.assign({}, c, {
        roles: c.roles || [], flags: c.flags || [], appears: c.appears || [], series,
        conf: c.conf || "high", vx: 0, vy: 0, fx: null, fy: null, deg: 0, vdeg: 1, links: []
      });
      n.primary = series[0]; n.label = c.short || c.name; n.isInst = n.primary === "inst";
      n.firstYear = D.works[c.first] ? D.works[c.first].y : 9999;
      n.edited = !!EDITS.characters[c.id]; n.isNew = !baseCharIds.has(c.id);
      const p = pos.get(c.id);
      if (p) { n.x = p.x; n.y = p.y; }
      else { const cc = centers[n.primary] || { x: 0, y: 0 }; n.x = cc.x + (rnd() - 0.5) * 180; n.y = cc.y + (rnd() - 0.5) * 180; }
      n.appearsAll = new Set([c.first].concat(n.appears).filter(k => D.works[k]));
      nodes.push(n); byId.set(n.id, n);
    });
    D.relationships.forEach(r => {
      const s = byId.get(r.s), t = byId.get(r.t);
      if (!s || !t) { issues.push(`Relationship ${r.id}: unknown character "${!s ? r.s : r.t}"`); return; }
      if (!D.edgeTypes[r.type]) issues.push(`Relationship ${r.id}: unknown type "${r.type}"`);
      if (!D.works[r.src]) issues.push(`Relationship ${r.id}: unknown source "${r.src}"`);
      (r.also || []).forEach(w => { if (!D.works[w]) issues.push(`Relationship ${r.id}: unknown work "${w}" in also`); });
      const l = Object.assign({}, r, { source: s, target: t, conf: r.conf || "high", also: r.also || [], type: D.edgeTypes[r.type] ? r.type : "other" });
      const ws = [l.src].concat(l.also).filter(k => D.works[k]);
      l.works = new Set(ws);
      l.year = ws.length ? Math.min.apply(null, ws.map(k => D.works[k].y)) : 9999;
      l.edited = !!EDITS.relationships[r.id]; l.isNew = !baseRelIds.has(r.id);
      links.push(l); s.links.push(l); t.links.push(l); s.deg++; t.deg++;
      if (!l.uncertain) ws.forEach(k => { s.appearsAll.add(k); t.appearsAll.add(k); });
    });
    const pairMap = new Map();
    links.forEach(l => {
      const k = [l.source.id, l.target.id].sort().join("|");
      if (!pairMap.has(k)) pairMap.set(k, []);
      pairMap.get(k).push(l);
    });
    pairMap.forEach(arr => arr.forEach((l, i) => {
      let c = (i - (arr.length - 1) / 2) * 22;
      if (l.source.id > l.target.id) c = -c;
      l.curv = c;
    }));
    nodes.forEach(n => {
      n.bridge = !n.isInst && new Set(n.series).size > 1;
      n.crossLinked = !n.isInst && !n.bridge && n.links.some(l => {
        const o = l.source === n ? l.target : l.source;
        return !o.isInst && !o.series.some(s => n.series.includes(s));
      });
      n.hasIncon = n.flags.some(f => f.kind === "inconsistency");
      n.r = n.isInst ? 10 : 4.5 + Math.sqrt(n.deg) * 2.1;
    });
    if (selected) {
      if (selected.kind === "node") { const n = byId.get(selected.obj.id); selected = n ? { kind: "node", obj: n } : null; }
      else { const l = links.find(x => x.id === selected.obj.id); selected = l ? { kind: "edge", obj: l } : null; }
    }
    if (hover) hover = byId.get(hover.id) || null;
    if (book && !D.works[book]) book = null;
    computeBookMembers();
    if (issues.length) console.warn("Wodehouse map data issues:", issues);
  }
  function computeBookMembers() {
    bookMembers = new Set(book ? nodes.filter(n => n.appearsAll.has(book)) : []);
  }

  const isVisible = n => n.series.some(s => enabledSeries.has(s)) && (book ? bookMembers.has(n) : n.firstYear <= yearMax);
  const linkVisible = l => isVisible(l.source) && isVisible(l.target) && enabledTypes.has(l.type) &&
    (showUncertain || !l.uncertain) && l.year <= (book ? D.works[book].y : yearMax);
  const filterActive = () => roleFilter.size > 0 || onlyBridges || onlyFlagged;
  const matches = n => (roleFilter.size === 0 || n.roles.some(r => roleFilter.has(r))) &&
    (!onlyBridges || n.bridge || n.crossLinked) && (!onlyFlagged || n.hasIncon);

  /* ================= Simulation ================= */
  function tick() {
    const act = nodes.filter(isVisible);
    const vl = links.filter(linkVisible);
    act.forEach(n => n.vdeg = 0);
    vl.forEach(l => { l.source.vdeg++; l.target.vdeg++; });
    act.forEach(n => { if (n.vdeg === 0) n.vdeg = 1; });
    const N = act.length;
    for (let i = 0; i < N; i++) {
      const a = act[i];
      for (let j = i + 1; j < N; j++) {
        const b = act[j];
        let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
        if (d2 > 160000) continue;
        if (d2 < 1) { dx = rnd() - 0.5; dy = rnd() - 0.5; d2 = 1; }
        const f = -380 * alpha / d2;
        a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
      }
    }
    vl.forEach(l => {
      const s = l.source, t = l.target;
      let dx = t.x + t.vx - s.x - s.vx, dy = t.y + t.vy - s.y - s.vy;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const dist = (s.isInst || t.isInst) ? 150 : 72;
      const k = (d - dist) / d * alpha * 0.8 / Math.min(s.vdeg, t.vdeg);
      dx *= k; dy *= k;
      const b = s.vdeg / (s.vdeg + t.vdeg);
      t.vx -= dx * b; t.vy -= dy * b; s.vx += dx * (1 - b); s.vy += dy * (1 - b);
    });
    const pull = book ? 0.012 : 0.04;
    act.forEach(n => {
      const c = book ? { x: 0, y: 0 } : centers[n.primary], str = n.isInst ? 0.012 : pull;
      n.vx += (c.x - n.x) * str * alpha; n.vy += (c.y - n.y) * str * alpha;
      if (n.fx != null) { n.x = n.fx; n.y = n.fy; n.vx = n.vy = 0; }
      else { n.vx *= 0.6; n.vy *= 0.6; n.x += n.vx; n.y += n.vy; }
    });
    alpha += (alphaTarget - alpha) * 0.0228;
  }
  const reheat = (a = 0.5) => { alpha = Math.max(alpha, a); dirty = true; };

  /* ================= Canvas ================= */
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const stage = document.getElementById("stage");
  let W = 0, H = 0, dpr = 1;
  const theme = {};
  let serif = "Georgia, serif";
  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    ["--bg", "--paper", "--ink", "--muted", "--line", "--brass", "--flag", "--inst"].forEach(v => theme[v.slice(2)] = cs.getPropertyValue(v).trim());
    serif = getComputedStyle(document.body).fontFamily;
    dirty = true;
  }
  readTheme();
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readTheme(); buildFilters(); });
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = stage.clientWidth; H = stage.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    dirty = true;
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  const toWorld = (sx, sy) => ({ x: (sx - T.x) / T.k, y: (sy - T.y) / T.k });
  const toScreen = (x, y) => ({ x: x * T.k + T.x, y: y * T.k + T.y });
  function ctrlPoint(l) {
    const s = l.source, t = l.target;
    const dx = t.x - s.x, dy = t.y - s.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    return { x: (s.x + t.x) / 2 - dy / d * l.curv, y: (s.y + t.y) / 2 + dx / d * l.curv };
  }
  function midPoint(l) {
    const c = ctrlPoint(l), s = l.source, t = l.target;
    return { x: 0.25 * s.x + 0.5 * c.x + 0.25 * t.x, y: 0.25 * s.y + 0.5 * c.y + 0.25 * t.y };
  }
  function focusSets() {
    if (!selected) return null;
    if (selected.kind === "node") {
      const n = selected.obj, ns = new Set([n]), ls = new Set();
      n.links.forEach(l => { if (linkVisible(l)) { ls.add(l); ns.add(l.source); ns.add(l.target); } });
      return { ns, ls };
    }
    const l = selected.obj;
    return { ns: new Set([l.source, l.target]), ls: new Set([l]) };
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = theme.bg; ctx.fillRect(0, 0, W, H);
    const F = focusSets(), fa = filterActive();
    const newYear = !book && isFinite(yearMax) ? yearMax : null;
    ctx.save(); ctx.translate(T.x, T.y); ctx.scale(T.k, T.k);

    for (const l of links) {
      if (!linkVisible(l)) continue;
      const et = D.edgeTypes[l.type];
      let a = 0.75;
      if (F) a = F.ls.has(l) ? 1 : 0.05;
      if (fa && !(matches(l.source) && matches(l.target))) a = Math.min(a, 0.06);
      if (book && !l.works.has(book)) a *= 0.32;
      if (l.uncertain) a *= 0.55;
      ctx.globalAlpha = a;
      ctx.strokeStyle = et.color;
      ctx.lineWidth = (et.width || 1.2) * (F && F.ls.has(l) ? 1.5 : 1) / T.k;
      ctx.setLineDash((et.dash || []).map(v => v / T.k));
      const c = ctrlPoint(l);
      ctx.beginPath(); ctx.moveTo(l.source.x, l.source.y);
      ctx.quadraticCurveTo(c.x, c.y, l.target.x, l.target.y); ctx.stroke();
    }
    ctx.setLineDash([]);

    for (const n of nodes) {
      if (!isVisible(n)) continue;
      let a = 1;
      if (F) a = F.ns.has(n) ? 1 : 0.14;
      if (fa && !matches(n)) a = Math.min(a, 0.12);
      ctx.globalAlpha = a;
      if (newYear !== null && n.firstYear === newYear) {
        ctx.fillStyle = theme.brass; ctx.globalAlpha = a * 0.3;
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 11 / T.k, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = a;
      }
      ctx.fillStyle = n.isInst ? theme.inst : D.clusters[n.primary].color;
      ctx.beginPath();
      if (n.isInst) ctx.rect(n.x - n.r, n.y - n.r, n.r * 2, n.r * 2);
      else ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 1 / T.k; ctx.strokeStyle = theme.bg; ctx.stroke();
      if (n.isInst) { ctx.strokeStyle = theme.ink; ctx.lineWidth = 1.2 / T.k; ctx.stroke(); }
      if (n.bridge) {
        const segs = n.series.length, R = n.r + 3.5 / T.k;
        ctx.lineWidth = 3 / T.k;
        n.series.forEach((s, i) => {
          ctx.strokeStyle = D.clusters[s].color;
          ctx.beginPath(); ctx.arc(n.x, n.y, R, (i / segs) * Math.PI * 2 - Math.PI / 2, ((i + 1) / segs) * Math.PI * 2 - Math.PI / 2); ctx.stroke();
        });
        ctx.strokeStyle = theme.brass; ctx.lineWidth = 1.4 / T.k;
        ctx.beginPath(); ctx.arc(n.x, n.y, R + 2.6 / T.k, 0, Math.PI * 2); ctx.stroke();
      } else if (n.crossLinked) {
        ctx.strokeStyle = theme.brass; ctx.lineWidth = 1.3 / T.k; ctx.setLineDash([3 / T.k, 2 / T.k]);
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 3 / T.k, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      }
      if (selected && selected.kind === "node" && selected.obj === n) {
        ctx.strokeStyle = theme.ink; ctx.lineWidth = 2 / T.k;
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 8 / T.k, 0, Math.PI * 2); ctx.stroke();
      }
    }
    ctx.restore();

    ctx.globalAlpha = 1; ctx.textBaseline = "middle";
    for (const l of links) {
      if (!linkVisible(l)) continue;
      const focused = F && F.ls.has(l);
      if (!(focused || (l.uncertain && !F))) continue;
      const m = midPoint(l), p = toScreen(m.x, m.y);
      if (p.x < -50 || p.y < -50 || p.x > W + 50 || p.y > H + 50) continue;
      const txt = focused ? (l.uncertain ? "? " : "") + D.edgeTypes[l.type].label.toLowerCase() : "?";
      ctx.font = `italic ${focused ? 11 : 12}px ${serif}`;
      const w = ctx.measureText(txt).width;
      ctx.fillStyle = theme.bg; ctx.globalAlpha = 0.85; ctx.fillRect(p.x - w / 2 - 3, p.y - 7, w + 6, 14);
      ctx.globalAlpha = 1; ctx.fillStyle = l.uncertain ? theme.flag : D.edgeTypes[l.type].color;
      ctx.textAlign = "center"; ctx.fillText(txt, p.x, p.y);
    }
    ctx.textAlign = "left";
    const small = book ? 0 : null;
    for (const n of nodes) {
      if (!isVisible(n)) continue;
      const p = toScreen(n.x, n.y);
      if (p.x < -80 || p.y < -40 || p.x > W + 80 || p.y > H + 40) continue;
      const dim = (F && !F.ns.has(n)) || (fa && !matches(n));
      const rs = n.r * T.k;
      if (n.hasIncon && !dim) {
        const br = Math.max(2.2, Math.min(5.5, rs * 0.6)), bx = p.x + rs * 0.8, by = p.y - rs * 0.8;
        ctx.fillStyle = theme.flag; ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
        if (br >= 4) { ctx.fillStyle = "#fff"; ctx.font = `bold 9px ${serif}`; ctx.textAlign = "center"; ctx.fillText("!", bx, by + 0.5); ctx.textAlign = "left"; }
      }
      let show = false;
      if (F && F.ns.has(n)) show = true;
      else if (hover === n) show = true;
      else if (!dim) {
        if (small === 0 || T.k > 1.25) show = true;
        else if (n.isInst && T.k > 0.45) show = true;
        else if (n.bridge && T.k > 0.5) show = true;
        else if (newYear !== null && n.firstYear === newYear) show = true;
        else if (n.deg >= (T.k > 0.8 ? 3 : T.k > 0.55 ? 5 : 7)) show = true;
      }
      if (!show) continue;
      const big = (selected && selected.kind === "node" && selected.obj === n) || hover === n;
      ctx.font = `${big ? "600 " : ""}${n.isInst ? "italic " : ""}${big ? 14 : 12}px ${serif}`;
      ctx.lineWidth = 3.5; ctx.strokeStyle = theme.bg; ctx.lineJoin = "round";
      ctx.strokeText(n.label, p.x + rs + 5, p.y);
      ctx.fillStyle = theme.ink; ctx.fillText(n.label, p.x + rs + 5, p.y);
    }
  }

  /* ================= Camera ================= */
  let tween = null;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function startTween(target) {
    if (reduceMotion) { Object.assign(T, target); dirty = true; return; }
    tween = { from: Object.assign({}, T), to: target, t: 0 };
  }
  const coveredBottom = () => {
    const panel = document.getElementById("panel");
    let c = document.getElementById("timebar").offsetHeight + 16;
    if (window.innerWidth <= 820 && panel.classList.contains("open")) c = Math.max(c, panel.offsetHeight);
    return c;
  };
  function fit(animate) {
    resize();
    const vis = nodes.filter(isVisible);
    if (!vis.length) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    vis.forEach(n => { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); });
    const usableH = H - coveredBottom() - 40;
    const k = Math.max(0.12, Math.min(1.8, Math.min(W / (x1 - x0 + 180), usableH / (y1 - y0 + 60))));
    const target = { k, x: W / 2 - (x0 + x1) / 2 * k, y: 40 + usableH / 2 - (y0 + y1) / 2 * k };
    animate ? startTween(target) : Object.assign(T, target);
    dirty = true;
  }
  function centreOn(n) {
    resize();
    const k = Math.max(T.k, 0.95);
    startTween({ k, x: W / 2 - n.x * k, y: (H - coveredBottom()) / 2 - n.y * k });
  }

  /* ================= Hit testing & pointer ================= */
  function hitNode(sx, sy) {
    const w = toWorld(sx, sy);
    let best = null, bd = Infinity;
    for (const n of nodes) {
      if (!isVisible(n)) continue;
      const d = Math.hypot(n.x - w.x, n.y - w.y);
      if (d < n.r + 8 / T.k && d < bd) { bd = d; best = n; }
    }
    return best;
  }
  function hitEdge(sx, sy) {
    const w = toWorld(sx, sy);
    let best = null, bd = 7 / T.k;
    for (const l of links) {
      if (!linkVisible(l)) continue;
      const c = ctrlPoint(l), s = l.source, t = l.target;
      for (let i = 0; i <= 16; i++) {
        const u = i / 16, a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, cc = u * u;
        const d = Math.hypot(a * s.x + b * c.x + cc * t.x - w.x, a * s.y + b * c.y + cc * t.y - w.y);
        if (d < bd) { bd = d; best = l; }
      }
    }
    return best;
  }
  const pointers = new Map();
  let drag = null, pan = null, pinch = null;
  const localXY = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener("pointerdown", e => {
    cv.setPointerCapture(e.pointerId);
    const p = localXY(e);
    pointers.set(e.pointerId, p);
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      if (drag) { drag.n.fx = drag.n.fy = null; drag = null; alphaTarget = 0; }
      pan = null;
      pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y), k0: T.k, w: toWorld((a.x + b.x) / 2, (a.y + b.y) / 2) };
      return;
    }
    const n = hitNode(p.x, p.y);
    if (n) { drag = { n, sx: p.x, sy: p.y, moved: false }; n.fx = n.x; n.fy = n.y; }
    else pan = { sx: p.x, sy: p.y, tx: T.x, ty: T.y, moved: false };
    cv.classList.add("dragging");
  });
  cv.addEventListener("pointermove", e => {
    const p = localXY(e);
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, p);
    if (pinch && pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      const k = Math.max(0.1, Math.min(5, pinch.k0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0));
      T.k = k; T.x = (a.x + b.x) / 2 - pinch.w.x * k; T.y = (a.y + b.y) / 2 - pinch.w.y * k; dirty = true; tween = null;
      return;
    }
    if (drag) {
      if (Math.hypot(p.x - drag.sx, p.y - drag.sy) > 4) drag.moved = true;
      if (drag.moved) { const w = toWorld(p.x, p.y); drag.n.fx = w.x; drag.n.fy = w.y; alphaTarget = 0.25; reheat(0.25); }
      return;
    }
    if (pan) {
      if (Math.hypot(p.x - pan.sx, p.y - pan.sy) > 4) pan.moved = true;
      T.x = pan.tx + p.x - pan.sx; T.y = pan.ty + p.y - pan.sy; dirty = true; tween = null;
      return;
    }
    if (e.pointerType === "mouse") {
      const h = hitNode(p.x, p.y);
      if (h !== hover) { hover = h; dirty = true; cv.style.cursor = h ? "pointer" : ""; }
    }
  });
  function endPointer(e) {
    const p = localXY(e);
    pointers.delete(e.pointerId);
    cv.classList.remove("dragging");
    if (pinch) { if (pointers.size < 2) pinch = null; pan = null; return; }
    if (drag) {
      drag.n.fx = drag.n.fy = null; alphaTarget = 0;
      if (!drag.moved) selectNode(drag.n, false);
      drag = null; return;
    }
    if (pan) {
      if (!pan.moved) { const l = hitEdge(p.x, p.y); if (l) selectEdge(l); else clearSelection(); }
      pan = null;
    }
  }
  cv.addEventListener("pointerup", endPointer);
  cv.addEventListener("pointercancel", endPointer);
  cv.addEventListener("pointerleave", () => { if (hover) { hover = null; dirty = true; } });
  cv.addEventListener("wheel", e => {
    e.preventDefault();
    const p = localXY(e), w = toWorld(p.x, p.y);
    const k = Math.max(0.1, Math.min(5, T.k * Math.exp(-e.deltaY * 0.0015)));
    T.k = k; T.x = p.x - w.x * k; T.y = p.y - w.y * k; dirty = true; tween = null;
  }, { passive: false });

  /* ================= Status ================= */
  const statusEl = document.getElementById("status");
  let statusTimer = null;
  function setStatus(msg, sticky) {
    statusEl.textContent = msg; statusEl.classList.add("show");
    clearTimeout(statusTimer);
    if (!sticky) statusTimer = setTimeout(() => statusEl.classList.remove("show"), 5000);
  }

  /* ================= Panel helpers ================= */
  const panel = document.getElementById("panel");
  const filtersEl = document.getElementById("filters");
  let formOpen = false;
  const workStr = k => {
    const w = D.works[k];
    return w ? `<button class="linkbtn" data-book="${esc(k)}"><i>${esc(w.t)}</i> (${w.y})</button>` : `<span class="issues">${esc(k)}?</span>`;
  };
  const confTag = c => c && c !== "high" ? `<span class="conf ${c}" title="Confidence in this attribution">${c} confidence</span>` : "";
  const seriesBadge = s => D.clusters[s] ? `<span class="badge" style="background:${D.clusters[s].color}">${esc(D.clusters[s].label)}</span>` : "";
  const nodeLink = n => `<button class="linkbtn" data-node="${esc(n.id)}">${esc(n.label)}</button>`;
  const lineSample = (t, w = 34) => {
    const et = D.edgeTypes[t];
    return `<svg width="${w}" height="10" aria-hidden="true"><line x1="1" y1="5" x2="${w - 1}" y2="5" stroke="${et.color}" stroke-width="${Math.max(1.6, et.width)}" stroke-dasharray="${(et.dash || []).join(",")}"/></svg>`;
  };
  const fmtDate = iso => { try { return new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return iso; } };
  const editedLine = o => o && o._by ? `<div class="edited">Last changed by ${esc(o._by)}, ${esc(fmtDate(o._at))}</div>` : "";
  const backToBook = () => book ? `<button class="linkbtn back" data-book="${esc(book)}">Back to <i>${esc(D.works[book].t)}</i></button><br>` : "";

  function openPanel(html, isForm) {
    formOpen = !!isForm;

    panel.classList.add("open");

  }

  }
  const relSentence = l => `${nodeLink(l.source)} ${esc(l.label)} ${nodeLink(l.target)}`;
  function relSources(l) {

    return `<div class="src">${s} ${confTag(l.conf)} ${l.uncertain ? '<span class="unc">uncertain, implied not stated</span>' : ""}</div>` +
      (l.note ? `<div class="note-text">${esc(l.note)}</div>` : "");
  }

  /* ================= View panels ================= */
  function renderNode(n) {
    let h = backToBook() + `<h2>${esc(n.name)}</h2>`;
    if (n.short && n.short !== n.name) h += `<div class="full">Known as ${esc(n.short)}</div>`;
    h += `<dl>
      <dt>Series</dt><dd>${n.series.map(seriesBadge).join("")}</dd>
      <dt>First appears</dt><dd>${workStr(n.first)} ${confTag(n.conf)}</dd>
      ${n.roles.length ? `<dt>Roles</dt><dd>${n.roles.map(r => `<button class="chip" data-role="${esc(r)}" aria-pressed="${roleFilter.has(r)}">${esc(r)}</button>`).join(" ")}</dd>` : ""}
    </dl>`;
    if (n.desc) h += `<p>${esc(n.desc)}</p>`;
    if (n.bridge) h += `<div class="bridge">Bridges ${n.series.map(s => esc(D.clusters[s].label)).join(" and ")}.</div>`;
    else if (n.crossLinked) {
      const others = new Set();
      n.links.forEach(l => { const o = l.source === n ? l.target : l.source; if (!o.isInst && !o.series.some(s => n.series.includes(s))) others.add(D.clusters[o.primary].label); });

    }

  function renderBook(k) {

  }

  function renderCoverage() {
    const counts = { medium: 0, low: 0 };
    nodes.forEach(n => { if (counts[n.conf] != null) counts[n.conf]++; });
    links.forEach(l => { if (counts[l.conf] != null) counts[l.conf]++; });
    let h = `<h2>Coverage and caveats</h2>`;

    h += `<p class="src">${nodes.length} entries, ${links.length} relationships, ${Object.keys(D.works).length} works. ${counts.medium} attributions are medium confidence and ${counts.low} low. ${links.filter(l => l.uncertain).length} relationships are marked uncertain.</p>`;
    D.coverage.forEach(c => { h += `<p class="cov"><b>${esc(c.area)}.</b> ${esc(c.note)}</p>`; });

  }

  function renderEditHub() {
    const c = { e: 0, a: 0, d: 0 }, r = { e: 0, a: 0, d: 0 };
    Object.keys(EDITS.characters).forEach(id => { const o = EDITS.characters[id]; if (o.deleted) c.d++; else if (baseCharIds.has(id)) c.e++; else c.a++; });
    Object.keys(EDITS.relationships).forEach(id => { const o = EDITS.relationships[id]; if (o.deleted) r.d++; else if (baseRelIds.has(id)) r.e++; else r.a++; });
    const wa = Object.keys(EDITS.works).length;
    let h = `<h2>Edit the data</h2>`;
    if (!storageOK) h += `<div class="flag"><b>Shared editing is unavailable here</b>This copy isn't running inside Claude, so changes can't be saved. Export still works.</div>`;
    h += `<div class="banner">Changes are saved to shared storage. Everyone who opens this map's link sees them and can change them, and there is no approval step, so export a backup now and then.</div>`;
    h += `<div class="form"><label>Your name, shown in the edit log<input id="f-who" value="${esc(who)}" placeholder="e.g. Tushar"></label></div>`;
    h += `<div class="btnrow"><button data-action="new-char">Add a character</button><button data-action="new-rel">Add a relationship</button><button data-action="new-work">Add a book or story</button></div>`;
    h += `<div class="btnrow"><button data-action="sync">Check for new edits</button><button data-action="export">Export data</button></div>`;
    h += `<p class="src">Shared changes so far: characters ${c.e} edited, ${c.a} added, ${c.d} deleted; relationships ${r.e} edited, ${r.a} added, ${r.d} deleted; ${wa} works added or edited.</p>`;
    h += `<h3>Recent edits</h3>`;
    if (!EDITS.log.length) h += `<p class="src">No shared edits yet.</p>`;
    else h += `<ul class="rels">${EDITS.log.slice(0, 40).map(e => `<li><span>${esc(e.who)} ${esc(e.what)}</span><div class="src">${esc(fmtDate(e.at))}</div></li>`).join("")}</ul>`;
    openPanel(h);
  }

  function exportObject() {
    const strip = o => { const c = clone(o); delete c._by; delete c._at; return c; };
    const works = {};
    Object.keys(D.works).sort((a, b) => D.works[a].y - D.works[b].y).forEach(k => works[k] = strip(D.works[k]));
    return {
      clusters: D.clusters, edgeTypes: D.edgeTypes, works,
      characters: D.characters.map(strip), relationships: D.relationships.map(strip), coverage: D.coverage
    };
  }
  function renderExport() {
    let h = `<h2>Export data</h2><p class="src">The full dataset including everyone's shared edits. To make the edits permanent, replace the DATA block at the top of the file with this, or paste it to Claude and ask for a new version.</p>
      <textarea id="exportBox" rows="14" readonly></textarea>
      <div class="btnrow"><button data-action="select-export">Select all</button><button data-action="copy-export">Copy</button><a id="dl" download="wodehouse-data.js">Download</a></div>`;
    openPanel(h);
    const txt = "const DATA = " + JSON.stringify(exportObject(), null, 1) + ";\n";
    document.getElementById("exportBox").value = txt;
    try { document.getElementById("dl").href = URL.createObjectURL(new Blob([txt], { type: "text/javascript" })); } catch (e) { document.getElementById("dl").remove(); }
  }

  /* ================= Forms ================= */
  const worksSorted = () => Object.keys(D.works).sort((a, b) => D.works[a].y - D.works[b].y || D.works[a].t.localeCompare(D.works[b].t));
  const workOptions = sel => worksSorted().map(k => `<option value="${esc(k)}" ${k === sel ? "selected" : ""}>${esc(D.works[k].t)} (${D.works[k].y})</option>`).join("");
  const confOptions = sel => ["high", "medium", "low"].map(c => `<option ${c === (sel || "high") ? "selected" : ""}>${c}</option>`).join("");
  const charOptions = sel => [...nodes].sort((a, b) => a.name.localeCompare(b.name)).map(n => `<option value="${esc(n.id)}" ${n.id === sel ? "selected" : ""}>${esc(n.name)}</option>`).join("");
  const formFooter = (action, id) => `<div class="banner">Saving shares this change with everyone who has the link.</div>
    <div id="f-error" class="issues" role="alert"></div>
    <div class="btnrow"><button class="primary" data-action="${action}" data-id="${esc(id || "")}">Save</button><button data-action="cancel" data-id="${esc(id || "")}" data-kind="${action}">Cancel</button></div>`;
  const val = id => { const el = panel.querySelector("#" + id); return el ? el.value : ""; };
  const formError = msg => { const el = panel.querySelector("#f-error"); if (el) el.textContent = msg; return null; };
  const parseKeys = s => s.split(/[\s,;]+/).map(x => x.trim().toUpperCase()).filter(Boolean);
  const flagRow = f => `<div class="flagrow">
      <select class="fk" aria-label="Flag kind"><option value="inconsistency" ${f.kind !== "note" ? "selected" : ""}>Canon inconsistency</option><option value="note" ${f.kind === "note" ? "selected" : ""}>Note</option></select>
      <textarea class="ft" rows="2" aria-label="Flag text">${esc(f.text || "")}</textarea>
      <input class="fw" aria-label="Work keys" placeholder="Work keys, e.g. JITM, MOJ" value="${esc((f.works || []).join(", "))}">
      <select class="fc" aria-label="Confidence">${confOptions(f.conf)}</select>
      <div><button data-action="rm-flag">Remove this flag</button></div></div>`;

  function renderCharForm(id) {
    const c = id ? clone(D.characters.find(x => x.id === id)) : { id: "", name: "", series: ["jw"], first: "", conf: "high", roles: [], desc: "", flags: [], appears: [] };
    const allRoles = [...new Set(nodes.flatMap(n => n.roles))].sort();
    const primary = (c.series || ["jw"])[0];
    let h = `<h2>${id ? "Edit " + esc(c.name) : "Add a character"}</h2><div class="form">
      <label>Name<input id="f-name" value="${esc(c.name)}"></label>
      <label>Short name, optional<input id="f-short" value="${esc(c.short || "")}"></label>
      ${id ? `<p class="src">Id: ${esc(id)}</p>` : `<label>Id, optional (made from the name if blank)<input id="f-id" placeholder="lowercase, no spaces"></label>`}
      <label>Main series (sets the colour)<select id="f-primary">${Object.keys(D.clusters).map(s => `<option value="${s}" ${s === primary ? "selected" : ""}>${esc(D.clusters[s].label)}</option>`).join("")}</select></label>
      <fieldset><legend>Also appears in these series</legend><div class="inline">${Object.keys(D.clusters).filter(s => s !== "inst").map(s => `<label><input type="checkbox" class="f-also" value="${s}" ${(c.series || []).slice(1).includes(s) ? "checked" : ""}>${esc(D.clusters[s].label)}</label>`).join("")}</div></fieldset>
      <label>First appearance<select id="f-first"><option value="">Choose a work</option>${workOptions(c.first)}</select></label>
      <label>Confidence in that attribution<select id="f-conf">${confOptions(c.conf)}</select></label>
      <label>Roles, separated by commas<input id="f-roles" value="${esc((c.roles || []).join(", "))}"></label>
      <p class="src">In use: ${allRoles.map(esc).join(", ")}</p>
      <label>Description<textarea id="f-desc" rows="3">${esc(c.desc || "")}</textarea></label>
      <fieldset><legend>Also appears in or is referenced by</legend>
        <input type="search" class="cl-filter" placeholder="Filter works" aria-label="Filter works">
        <div class="checklist">${worksSorted().map(k => `<label><input type="checkbox" class="f-appears" value="${esc(k)}" ${(c.appears || []).includes(k) ? "checked" : ""}><span>${esc(D.works[k].t)} (${D.works[k].y})</span><span class="wkey">${esc(k)}</span></label>`).join("")}</div>
      </fieldset>
      <fieldset><legend>Inconsistencies and notes</legend><div id="f-flags">${(c.flags || []).map(flagRow).join("")}</div>
        <div class="btnrow"><button data-action="add-flag">Add a flag</button></div>
        <p class="src">Work keys are shown in grey in the list above.</p></fieldset>
      ${formFooter("save-char", id)}</div>`;
    openPanel(h, true);
  }

  function gatherChar(editingId) {
    const name = val("f-name").trim();
    if (!name) return formError("Add a name.");
    let id = editingId;
    if (!id) {
      id = (val("f-id").trim() || name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      if (!id) return formError("Choose an id using letters or numbers.");
      if (byId.has(id) || EDITS.characters[id]) return formError(`The id "${id}" is already taken. Choose another.`);
    }
    const primary = val("f-primary");
    const also = [...panel.querySelectorAll(".f-also:checked")].map(x => x.value).filter(s => s !== primary);
    const first = val("f-first");
    if (!D.works[first]) return formError("Choose a first appearance. If the work is missing, add it from Edit data first.");
    const flags = [];
    for (const row of panel.querySelectorAll(".flagrow")) {
      const text = row.querySelector(".ft").value.trim();
      if (!text) continue;
      const ws = parseKeys(row.querySelector(".fw").value);
      const bad = ws.filter(k => !D.works[k]);
      if (bad.length) return formError(`Unknown work key in a flag: ${bad.join(", ")}.`);
      const f = { kind: row.querySelector(".fk").value, text, works: ws };
      const fc = row.querySelector(".fc").value; if (fc !== "high") f.conf = fc;
      flags.push(f);
    }
    const base = editingId ? clone(D.characters.find(x => x.id === editingId)) : {};
    delete base._by; delete base._at;
    const obj = Object.assign(base, {
      id, name, series: [primary].concat(also), first, conf: val("f-conf"),
      roles: val("f-roles").split(",").map(s => s.trim()).filter(Boolean),
      desc: val("f-desc").trim(),
      appears: [...panel.querySelectorAll(".f-appears:checked")].map(x => x.value).filter(k => k !== first),
      flags
    });
    const short = val("f-short").trim();
    if (short) obj.short = short; else delete obj.short;
    if (obj.conf === "high") delete obj.conf;
    return obj;
  }

  function renderRelForm(id, presetS) {
    const r = id ? clone(D.relationships.find(x => x.id === id)) : { s: presetS || "", t: "", type: "family", label: "", src: "", also: [], conf: "high", uncertain: false, note: "" };
    let h = `<h2>${id ? "Edit relationship" : "Add a relationship"}</h2><div class="form">
      <p class="src">Reads as a sentence: first character, label, second character. For example, "Aunt Agatha" "is the aunt of" "Bertie Wooster".</p>
      <label>First character<select id="f-s"><option value="">Choose</option>${charOptions(r.s)}</select></label>
      <label>Label<input id="f-label" value="${esc(r.label)}" placeholder="is the aunt of"></label>
      <label>Second character<select id="f-t"><option value="">Choose</option>${charOptions(r.t)}</select></label>
      <label>Type<select id="f-type">${Object.keys(D.edgeTypes).map(t => `<option value="${t}" ${t === r.type ? "selected" : ""}>${esc(D.edgeTypes[t].label)}</option>`).join("")}</select></label>
      <label>Source (where it's established)<select id="f-src"><option value="">Choose a work</option>${workOptions(r.src)}</select></label>
      <label>Also in, as work keys separated by commas<input id="f-alsow" value="${esc((r.also || []).join(", "))}" placeholder="e.g. JITM, MOJ"></label>
      <label>Confidence<select id="f-conf">${confOptions(r.conf)}</select></label>
      <div class="inline"><label><input type="checkbox" id="f-unc" ${r.uncertain ? "checked" : ""}>Uncertain: implied but never stated</label></div>
      <label>Note, optional<textarea id="f-note" rows="2">${esc(r.note || "")}</textarea></label>
      ${formFooter("save-rel", id)}</div>`;
    openPanel(h, true);
  }

  function gatherRel(editingId) {
    const s = val("f-s"), t = val("f-t"), label = val("f-label").trim(), type = val("f-type"), src = val("f-src");
    if (!byId.has(s) || !byId.has(t)) return formError("Choose both characters.");
    if (s === t) return formError("A relationship needs two different characters.");
    if (!label) return formError("Add a label, such as \"is the aunt of\".");
    if (!D.works[src]) return formError("Choose the source work.");
    const also = parseKeys(val("f-alsow")).filter(k => k !== src);
    const bad = also.filter(k => !D.works[k]);
    if (bad.length) return formError(`Unknown work key: ${bad.join(", ")}.`);
    const base = editingId ? clone(D.relationships.find(x => x.id === editingId)) : {};
    delete base._by; delete base._at;
    let id = editingId;
    if (!id) {
      id = `${s}|${type}|${t}`;
      if (baseRelIds.has(id) || EDITS.relationships[id] || links.some(l => l.id === id)) id += "#" + Date.now().toString(36);
    }
    const obj = Object.assign(base, { id, s, t, type, label, src, also });
    const conf = val("f-conf"); if (conf !== "high") obj.conf = conf; else delete obj.conf;
    if (panel.querySelector("#f-unc").checked) obj.uncertain = true; else delete obj.uncertain;
    const note = val("f-note").trim(); if (note) obj.note = note; else delete obj.note;
    if (!obj.also.length) delete obj.also;
    return obj;
  }

  function renderWorkForm(k) {
    const w = k ? D.works[k] : { t: "", y: "", k: "novel" };
    let h = `<h2>${k ? "Edit book details" : "Add a book or story"}</h2><div class="form">
      ${k ? `<p class="src">Key: ${esc(k)}</p>` : `<label>Key: 2 to 8 capital letters or digits<input id="f-key" placeholder="e.g. UNEASY"></label>`}
      <label>Title<input id="f-title" value="${esc(w.t)}"></label>
      <label>Year of first publication<input id="f-year" type="number" min="1890" max="1990" value="${esc(w.y)}"></label>
      <label>Kind<select id="f-kind">${["novel", "story", "collection", "play"].map(x => `<option ${x === w.k ? "selected" : ""}>${x}</option>`).join("")}</select></label>
      ${formFooter("save-work", k)}</div>`;
    openPanel(h, true);
  }

  /* ================= Shared storage ================= */
  async function fetchRemote() {
    let r = null;
    try { r = await window.storage.get(STORE_KEY, true); } catch (e) { r = null; }
    if (r && typeof r.value === "string") {
      try { return normalise(JSON.parse(r.value)); }
      catch (e) { issues.push("Shared edits were unreadable and have been ignored."); return emptyEdits(); }
    }
    let keys = null;
    try { const l = await window.storage.list("wodehouse-map:", true); if (l && Array.isArray(l.keys)) keys = l.keys.map(k => typeof k === "string" ? k : (k && k.key)); } catch (e) { keys = null; }
    if (keys && !keys.includes(STORE_KEY)) return emptyEdits();
    throw new Error("Shared storage unreachable");
  }
  async function commit(mutate, what, after) {
    if (!storageOK) { setStatus("Shared editing only works when the map is opened in Claude. Use Export to keep a copy."); return false; }
    setStatus("Saving…", true);
    let latest;
    try { latest = await fetchRemote(); }
    catch (e) { setStatus("Couldn't reach shared storage, so nothing was saved. Try again in a moment."); return false; }
    const at = new Date().toISOString(), by = who || "Anonymous";
    mutate(latest, { _by: by, _at: at });
    latest.log.unshift({ at, who: by, what });
    latest.log = latest.log.slice(0, 200);
    try {
      const r = await window.storage.set(STORE_KEY, JSON.stringify(latest), true);
      if (!r) throw new Error("no result");
    } catch (e) { setStatus("Couldn't save the change. Nothing was stored; try again."); return false; }
    EDITS = latest; lastSync = Date.now();
    rebuildAll();
    setStatus("Saved. Everyone with the link will see it.");
    if (after) after();
    return true;
  }
  let lastSync = 0;
  async function sync(quiet) {
    if (!storageOK) { if (!quiet) setStatus("Shared editing only works when the map is opened in Claude."); return; }
    if (!quiet) setStatus("Checking for new edits…", true);
    try {
      const e = await fetchRemote();
      const changed = JSON.stringify(e) !== JSON.stringify(EDITS);
      EDITS = e; lastSync = Date.now();
      if (changed) rebuildAll();
      if (!quiet || changed) setStatus(changed ? `Loaded shared edits (${EDITS.log.length} in the log).` : "You're up to date.");
    } catch (err) {
      if (!quiet) setStatus("Couldn't load shared edits; showing what's already on screen. Try again shortly.");
    }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !formOpen && Date.now() - lastSync > 60000) sync(true);
  });

  function rebuildAll() {
    buildGraph(); buildFilters(); buildBookSelect(); buildDatalist(); updateTimeline(); updateStats(); reheat(0.4);
  }

  /* ================= Panel actions ================= */
  panel.addEventListener("input", e => {
    if (e.target.classList.contains("cl-filter")) {
      const q = e.target.value.toLowerCase();
      e.target.parentElement.querySelectorAll(".checklist label").forEach(l => { l.style.display = l.textContent.toLowerCase().includes(q) ? "" : "none"; });
    }
    if (e.target.id === "f-who") {
      who = e.target.value.trim();
      if (storageOK) { try { window.storage.set(WHO_KEY, who, false).catch(() => {}); } catch (err) { /* personal storage optional */ } }
    }
  });

  panel.addEventListener("click", async e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.hasAttribute("data-close")) { clearSelection(); return; }
    if (b.dataset.node) { const n = byId.get(b.dataset.node); if (n) selectNode(n, true); return; }
    if (b.dataset.book) { enterBook(b.dataset.book); return; }
    if (b.dataset.role) { toggleRole(b.dataset.role); b.setAttribute("aria-pressed", roleFilter.has(b.dataset.role)); return; }
    const a = b.dataset.action, id = b.dataset.id;
    if (!a) return;
    const n = id ? byId.get(id) : null;
    switch (a) {
      case "edit-char": renderCharForm(id); break;
      case "new-char": renderCharForm(null); break;
      case "new-rel": renderRelForm(null, id || ""); break;
      case "edit-rel": renderRelForm(id); break;
      case "new-work": renderWorkForm(null); break;
      case "edit-work": renderWorkForm(id); break;
      case "add-flag": panel.querySelector("#f-flags").insertAdjacentHTML("beforeend", flagRow({ kind: "inconsistency" })); break;
      case "rm-flag": b.closest(".flagrow").remove(); break;
      case "cancel": {
        const kind = b.dataset.kind;
        if (kind === "save-char" && id && byId.get(id)) selectNode(byId.get(id), false);
        else if (kind === "save-rel" && id) { const l = links.find(x => x.id === id); l ? selectEdge(l) : renderEditHub(); }
        else if (kind === "save-work" && id && book === id) renderBook(id);
        else renderEditHub();
        break;
      }
      case "save-char": {
        const obj = gatherChar(id || null); if (!obj) return;
        b.disabled = true;
        const ok = await commit((ed, meta) => { ed.characters[obj.id] = Object.assign(obj, meta); }, `${id ? "edited" : "added"} ${obj.name}`,
          () => { const nn = byId.get(obj.id); if (nn) selectNode(nn, !id); });
        if (!ok) b.disabled = false;
        break;
      }
      case "save-rel": {
        const obj = gatherRel(id || null); if (!obj) return;
        b.disabled = true;
        const nm = x => (byId.get(x) || { label: x }).label;
        const ok = await commit((ed, meta) => { ed.relationships[obj.id] = Object.assign(obj, meta); }, `${id ? "edited" : "added"} "${nm(obj.s)} ${obj.label} ${nm(obj.t)}"`,
          () => { const l = links.find(x => x.id === obj.id); if (l) selectEdge(l); });
        if (!ok) b.disabled = false;
        break;
      }
      case "save-work": {
        let k = id;
        if (!k) {
          k = val("f-key").trim().toUpperCase();
          if (!/^[A-Z0-9]{2,8}$/.test(k)) return formError("Use 2 to 8 capital letters or digits for the key.");
          if (D.works[k]) return formError(`The key ${k} is already used by ${D.works[k].t}.`);
        }
        const t = val("f-title").trim(), y = parseInt(val("f-year"), 10), kind = val("f-kind");
        if (!t) return formError("Add a title.");
        if (!(y >= 1890 && y <= 1990)) return formError("Add a year between 1890 and 1990.");
        b.disabled = true;
        const ok = await commit((ed, meta) => { ed.works[k] = Object.assign({ t, y, k: kind }, meta); }, `${id ? "edited" : "added"} the work ${t} (${y})`,
          () => { if (book === k) renderBook(k); else renderEditHub(); });
        if (!ok) b.disabled = false;
        break;
      }
      case "del-char": {
        if (!n) return;
        const rels = n.links.map(l => l.id);
        if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = `Confirm: delete ${n.label} and ${rels.length} relationship${rels.length === 1 ? "" : "s"}`; return; }
        b.disabled = true;
        await commit((ed, meta) => {
          if (baseCharIds.has(n.id)) ed.characters[n.id] = Object.assign({ id: n.id, deleted: true }, meta); else delete ed.characters[n.id];
          rels.forEach(rid => { if (baseRelIds.has(rid)) ed.relationships[rid] = Object.assign({ id: rid, deleted: true }, meta); else delete ed.relationships[rid]; });
        }, `deleted ${n.name}`, () => clearSelection());
        break;
      }
      case "del-rel": {
        const l = links.find(x => x.id === id); if (!l) return;
        if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Confirm delete"; return; }
        b.disabled = true;
        await commit((ed, meta) => {
          if (baseRelIds.has(id)) ed.relationships[id] = Object.assign({ id, deleted: true }, meta); else delete ed.relationships[id];
        }, `deleted "${l.source.label} ${l.label} ${l.target.label}"`, () => clearSelection());
        break;
      }
      case "revert-char":
        b.disabled = true;
        await commit(ed => { delete ed.characters[id]; }, `reverted ${n ? n.name : id} to the original`, () => { const nn = byId.get(id); if (nn) selectNode(nn, false); });
        break;
      case "revert-rel":
        b.disabled = true;
        await commit(ed => { delete ed.relationships[id]; }, `reverted a relationship to the original`, () => { const l = links.find(x => x.id === id); if (l) selectEdge(l); });
        break;
      case "exit-book": exitBook(); break;
      case "sync": await sync(false); renderEditHub(); break;
      case "export": renderExport(); break;
      case "select-export": { const t = document.getElementById("exportBox"); t.focus(); t.select(); break; }
      case "copy-export": {
        const t = document.getElementById("exportBox");
        try { await navigator.clipboard.writeText(t.value); setStatus("Copied the data."); }
        catch (err) { t.focus(); t.select(); setStatus("Copying was blocked here. The text is selected; copy it manually."); }
        break;
      }
    }
  });

  /* ================= Selection ================= */
  function selectNode(n, centre) {
    let changed = false;
    if (book && !bookMembers.has(n)) { exitBook(true); changed = true; }
    if (!book && n.firstYear > yearMax) { yearMax = Infinity; updateTimeline(); changed = true; }
    if (!n.series.some(s => enabledSeries.has(s))) { n.series.forEach(s => enabledSeries.add(s)); buildFilters(); changed = true; }
    if (changed) { reheat(0.3); updateStats(); }
    selected = { kind: "node", obj: n }; dirty = true;
    renderNode(n);
    if (centre) centreOn(n);
  }
  function selectEdge(l) { selected = { kind: "edge", obj: l }; dirty = true; renderEdge(l); }
  function clearSelection() { selected = null; dirty = true; closePanel(); }

  /* ================= Book view & timeline ================= */
  const yearSlider = document.getElementById("year");
  const yearLabel = document.getElementById("yearLabel");
  const yearNote = document.getElementById("yearNote");
  const playBtn = document.getElementById("play");
  const bookSel = document.getElementById("bookSel");

  function enterBook(k) {
    if (!D.works[k]) return;
    stopPlay();
    if (!book) posSnapshot = new Map(nodes.map(n => [n.id, { x: n.x, y: n.y }]));
    book = k; selected = null; computeBookMembers();
    alpha = 1;
    for (let i = 0; i < 300; i++) tick();
    alpha = 0.004;
    bookSel.value = k;
    updateTimeline(); updateStats(); renderBook(k);
    fit(true); dirty = true;
  }
  function exitBook(keepPanel) {
    if (!book) return;
    book = null; computeBookMembers();
    if (posSnapshot) nodes.forEach(n => { const p = posSnapshot.get(n.id); if (p) { n.x = p.x; n.y = p.y; n.vx = n.vy = 0; } });
    posSnapshot = null;
    bookSel.value = "";
    alpha = 0.05;
    updateTimeline(); updateStats(); fit(true);
    if (!keepPanel) { selected = null; closePanel(); }
    dirty = true;
  }

  function updateTimeline() {
    const ys = nodes.filter(n => n.firstYear < 9999).map(n => n.firstYear);
    yMin = ys.length ? Math.min.apply(null, ys) : 1900;
    const used = Object.keys(D.works).filter(k => nodes.some(n => n.appearsAll.has(k))).map(k => D.works[k].y);
    yMaxBound = Math.max(yMin + 1, used.length ? Math.max.apply(null, used) : yMin + 1);
    eventYears = [...new Set(ys.concat(links.map(l => l.year)).filter(y => y < 9999))].sort((a, b) => a - b);
    yearSlider.min = yMin; yearSlider.max = yMaxBound;
    yearSlider.disabled = !!book; playBtn.disabled = !!book;
    if (book) {
      const w = D.works[book];
      yearSlider.value = w.y; yearLabel.textContent = w.y;
      yearNote.innerHTML = `Viewing one book. <button class="linkbtn" data-exit>Back to the whole canon</button>`;
      return;
    }
    const y = isFinite(yearMax) ? yearMax : yMaxBound;
    yearSlider.value = y;
    yearLabel.textContent = y;
    if (!isFinite(yearMax)) { yearNote.textContent = "The whole canon. Drag back to see it as it stood in any year, or press Play."; return; }
    const pubs = Object.keys(D.works).filter(k => D.works[k].y === y && nodes.some(n => n.appearsAll.has(k)));
    const debuts = nodes.filter(n => n.firstYear === y && !n.isInst).length;
    yearNote.innerHTML = (debuts ? `${debuts} new this year. ` : "") + pubs.map(k => `<button class="linkbtn" data-book="${esc(k)}"><i>${esc(D.works[k].t)}</i></button>`).join(" ");
  }
  yearSlider.addEventListener("input", () => {
    stopPlay();
    const v = parseInt(yearSlider.value, 10);
    yearMax = v >= yMaxBound ? Infinity : v;
    if (selected && selected.kind === "node" && !isVisible(selected.obj)) clearSelection();
    updateTimeline(); updateStats(); reheat(0.3);
  });
  let playTimer = null;
  function stopPlay() { if (playTimer) { clearInterval(playTimer); playTimer = null; playBtn.textContent = "Play"; } }
  playBtn.addEventListener("click", () => {
    if (playTimer) { stopPlay(); return; }
    if (!isFinite(yearMax) || yearMax >= yMaxBound) yearMax = eventYears[0] || yMin;
    playBtn.textContent = "Pause";
    updateTimeline(); updateStats(); reheat(0.4);
    playTimer = setInterval(() => {
      const next = eventYears.find(y => y > yearMax);
      if (next == null || next >= yMaxBound) { yearMax = Infinity; stopPlay(); }
      else yearMax = next;
      updateTimeline(); updateStats(); reheat(0.35);
    }, 750);
  });
  document.getElementById("timebar").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.book) enterBook(b.dataset.book);
    if (b.hasAttribute("data-exit")) exitBook();
  });
  function buildBookSelect() {
    const groups = {};
    Object.keys(D.works).forEach(k => {
      const cast = nodes.filter(n => n.appearsAll.has(k) && !n.isInst);
      if (!cast.length) return;
      const tally = {};
      cast.forEach(n => tally[n.primary] = (tally[n.primary] || 0) + 1);
      const g = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0];
      (groups[g] = groups[g] || []).push(k);
    });
    let h = `<option value="">View one book's world</option>`;
    Object.keys(D.clusters).filter(c => groups[c]).forEach(c => {
      h += `<optgroup label="${esc(D.clusters[c].label)}">` +
        groups[c].sort((a, b) => D.works[a].y - D.works[b].y).map(k => `<option value="${esc(k)}">${esc(D.works[k].t)} (${D.works[k].y})</option>`).join("") + `</optgroup>`;
    });
    bookSel.innerHTML = h;
    bookSel.value = book || "";
  }
  bookSel.addEventListener("change", () => { bookSel.value ? enterBook(bookSel.value) : exitBook(); });

  /* ================= Filters ================= */
  function toggleRole(r) { roleFilter.has(r) ? roleFilter.delete(r) : roleFilter.add(r); buildFilters(); dirty = true; }
  function buildFilters() {
    const sc = {}; nodes.forEach(n => n.series.forEach(s => sc[s] = (sc[s] || 0) + 1));
    const tc = {}; links.forEach(l => tc[l.type] = (tc[l.type] || 0) + 1);
    const rc = {}; nodes.forEach(n => n.roles.forEach(r => rc[r] = (rc[r] || 0) + 1));
    const roles = Object.keys(rc).sort((a, b) => rc[b] - rc[a] || a.localeCompare(b));
    let h = `<h3>Series</h3><div class="chips">` +
      Object.keys(D.clusters).map(s => `<button class="chip ${enabledSeries.has(s) ? "" : "off"}" data-series="${s}"><span class="sw" style="background:${D.clusters[s].color}${s === "inst" ? ";border-radius:1px" : ""}"></span>${esc(D.clusters[s].label)} <span class="n">${sc[s] || 0}</span></button>`).join("") +
      `</div><div style="margin-top:6px"><button class="linkbtn" data-allseries>Show all</button></div>`;
    h += `<h3>Roles</h3><div class="chips">` +
      roles.map(r => `<button class="chip" data-role="${esc(r)}" aria-pressed="${roleFilter.has(r)}">${esc(r)} <span class="n">${rc[r]}</span></button>`).join("") +
      `</div>${roleFilter.size ? `<div style="margin-top:6px"><button class="linkbtn" data-clearroles>Clear roles</button></div>` : ""}`;
    h += `<h3>Highlight</h3><div class="toggles">
      <label><input type="checkbox" data-t="bridges" ${onlyBridges ? "checked" : ""}> Bridging characters</label>
      <label><input type="checkbox" data-t="flagged" ${onlyFlagged ? "checked" : ""}> Canon inconsistencies</label>
      <label><input type="checkbox" data-t="uncertain" ${showUncertain ? "checked" : ""}> Show uncertain relationships</label></div>`;
    h += `<h3>Relationship types</h3><div class="chips">` +
      Object.keys(D.edgeTypes).map(t => `<button class="chip ${enabledTypes.has(t) ? "" : "off"}" data-type="${t}">${lineSample(t, 26)}${esc(D.edgeTypes[t].label)} <span class="n">${tc[t] || 0}</span></button>`).join("") + `</div>`;
    h += `<h3>Key</h3><div class="key">
      <div><svg width="26" height="26"><circle cx="13" cy="13" r="6" fill="${D.clusters.bl.color}"/><path d="M13 3.5 A9.5 9.5 0 0 1 13 22.5" stroke="${D.clusters.bl.color}" stroke-width="3" fill="none"/><path d="M13 22.5 A9.5 9.5 0 0 1 13 3.5" stroke="${D.clusters.ps.color}" stroke-width="3" fill="none"/><circle cx="13" cy="13" r="12" stroke="${theme.brass}" stroke-width="1.3" fill="none"/></svg> Appears in more than one series (ring shows which)</div>
      <div><svg width="26" height="26"><circle cx="13" cy="13" r="6" fill="${D.clusters.jw.color}"/><circle cx="13" cy="13" r="9" stroke="${theme.brass}" stroke-width="1.3" stroke-dasharray="3 2" fill="none"/></svg> One series, but linked into another</div>
      <div><svg width="26" height="26"><circle cx="13" cy="13" r="7" fill="${theme.flag}"/><text x="13" y="17" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">!</text></svg> Canon inconsistency flagged</div>
      <div><svg width="26" height="26"><rect x="5" y="5" width="16" height="16" fill="${theme.inst}" stroke="${theme.ink}"/></svg> Club, school or firm</div>
      <div><svg width="26" height="26"><circle cx="13" cy="13" r="11" fill="${theme.brass}" opacity=".3"/><circle cx="13" cy="13" r="5" fill="${D.clusters.uf.color}"/></svg> First appears in the year shown on the timeline</div>
      <div><span style="color:${theme.flag};font-style:italic;width:26px;text-align:center">?</span> Uncertain: implied, not stated</div>
      <div>Node size grows with the number of relationships. Drag, scroll or pinch to move around; click a character or a line.</div></div>`;
    filtersEl.innerHTML = h;
  }
  filtersEl.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.series) { const s = b.dataset.series; enabledSeries.has(s) ? enabledSeries.delete(s) : enabledSeries.add(s); if (selected && selected.kind === "node" && !isVisible(selected.obj)) clearSelection(); buildFilters(); reheat(0.4); updateStats(); }
    else if (b.hasAttribute("data-allseries")) { Object.keys(D.clusters).forEach(s => enabledSeries.add(s)); buildFilters(); reheat(0.4); updateStats(); }
    else if (b.dataset.role) toggleRole(b.dataset.role);
    else if (b.hasAttribute("data-clearroles")) { roleFilter.clear(); buildFilters(); dirty = true; }
    else if (b.dataset.type) { const t = b.dataset.type; enabledTypes.has(t) ? enabledTypes.delete(t) : enabledTypes.add(t); buildFilters(); reheat(0.3); updateStats(); }
  });
  filtersEl.addEventListener("change", e => {
    const t = e.target.dataset.t;
    if (t === "bridges") onlyBridges = e.target.checked;
    if (t === "flagged") onlyFlagged = e.target.checked;
    if (t === "uncertain") { showUncertain = e.target.checked; reheat(0.2); }
    dirty = true; updateStats();
  });

  function setBtn(id, on) { document.getElementById(id).setAttribute("aria-pressed", on); }
  document.getElementById("btnFilters").addEventListener("click", () => {
    const open = !filtersEl.classList.contains("open");
    filtersEl.classList.toggle("open", open); setBtn("btnFilters", open);
    if (open && window.innerWidth <= 820) closePanel();
  });
  document.getElementById("btnNotes").addEventListener("click", () => { selected = null; dirty = true; renderCoverage(); });
  document.getElementById("btnEdit").hidden = READ_ONLY;
  document.getElementById("btnEdit").addEventListener("click", () => { selected = null; dirty = true; renderEditHub(); });
  document.getElementById("btnFit").addEventListener("click", () => fit(true));

  /* ================= Search ================= */
  const dl = document.getElementById("names");
  function buildDatalist() {
    dl.innerHTML = [...nodes].sort((a, b) => a.name.localeCompare(b.name)).map(n => `<option value="${esc(n.name)}"></option>`).join("");
  }
  const search = document.getElementById("search");
  function doSearch() {
    const q = search.value.trim().toLowerCase();
    if (!q) return;
    const n = nodes.find(n => n.name.toLowerCase() === q) || nodes.find(n => n.label.toLowerCase() === q) ||
      nodes.find(n => n.name.toLowerCase().includes(q) || n.label.toLowerCase().includes(q));
    if (n) selectNode(n, true); else setStatus(`No character matches "${search.value.trim()}".`);
  }
  search.addEventListener("change", doSearch);
  search.addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !formOpen) clearSelection(); });

  function updateStats() {
    const vn = nodes.filter(n => isVisible(n) && !n.isInst).length;
    const vl = links.filter(linkVisible).length;
    const br = nodes.filter(n => isVisible(n) && n.bridge).length;
    const fl = nodes.filter(n => isVisible(n) && n.hasIncon).length;
    document.getElementById("stats").textContent = `${vn} characters, ${vl} relationships, ${br} bridges, ${fl} flagged` + (issues.length ? `, ${issues.length} data issues` : "");
  }

  /* ================= Start ================= */
  buildGraph();
  buildFilters(); buildBookSelect(); buildDatalist(); updateTimeline(); updateStats();
  for (let i = 0; i < 320; i++) tick();
  if (window.innerWidth > 1100) { filtersEl.classList.add("open"); setBtn("btnFilters", true); }
  requestAnimationFrame(() => fit(false));

  if (storageOK) {
    (async () => {
      try { const r = await window.storage.get(WHO_KEY, false); if (r && typeof r.value === "string") who = r.value; } catch (e) { /* no saved name */ }
      await sync(true);
    })();
  }

  function frame() {
    if (tween) {
      tween.t = Math.min(1, tween.t + 0.08);
      const e = 1 - Math.pow(1 - tween.t, 3);
      T.k = tween.from.k + (tween.to.k - tween.from.k) * e;
      T.x = tween.from.x + (tween.to.x - tween.from.x) * e;
      T.y = tween.from.y + (tween.to.y - tween.from.y) * e;
      if (tween.t >= 1) tween = null;
      dirty = true;
    }
    if (alpha > 0.003 || alphaTarget > 0) { tick(); dirty = true; }
    if (dirty) { draw(); dirty = false; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
